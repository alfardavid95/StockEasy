<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head('Iniciar sesión')}"></head>
<body class="login-body">
<main class="login-card">
    <h1><i class="fa-solid fa-cube"></i> Stock<span>Easy</span></h1>
    <p>Sistema Web de Control de Inventario</p>

    <div th:if="${param.error}" class="alert alert-danger">Correo o contraseña incorrectos</div>
    <div th:if="${param.logout}" class="alert alert-success">Sesión cerrada correctamente</div>

    <form th:action="@{/login}" method="post">
        <label>Correo electrónico</label>
        <input class="form-control mb-3" type="email" name="correo" required>
        <label>Contraseña</label>
        <input class="form-control mb-3" type="password" name="contrasena" required>
        <button class="btn btn-primary w-100">Ingresar</button>
    </form>

    <hr class="my-4">

    <div class="alert alert-warning">
        <i class="fa-solid fa-flask"></i> <b>Usuarios de prueba</b>
        <ul class="mb-0 mt-2">
            <li>david@stockeasy.com | 123456 - ADMINISTRADOR</li>
            <li>ana@stockeasy.com | 123456 - ENCARGADO</li>
            <li>laura@stockeasy.com | 123456 - CONSULTA</li>
        </ul>
    </div>

</main>
<div th:replace="~{general/fragmentos :: scripts}"></div>
</body>
</html>

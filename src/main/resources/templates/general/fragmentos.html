<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${titulo} + ' - StockEasy'">
        StockEasy
    </title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/webjars/font-awesome/css/all.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/stockeasy.css}">

    <meta name="_csrf"
          th:content="${_csrf.token}"/>

    <meta name="_csrf_header"
          th:content="${_csrf.headerName}"/>
</head>

<body>

<div class="offcanvas offcanvas-start"
     tabindex="-1"
     id="menuLateral"
     aria-labelledby="menuLateralLabel"
     th:fragment="sidebar">

    <div class="offcanvas-header border-bottom">

        <h5 class="offcanvas-title"
            id="menuLateralLabel">

            <i class="fa-solid fa-cube text-primary"></i>

            Stock<span class="text-primary">Easy</span>

        </h5>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
                aria-label="Cerrar">
        </button>

    </div>

    <div class="offcanvas-body">

        <nav class="nav flex-column gap-1">

            <!-- DASHBOARD -->
            <a class="nav-link"
               th:href="@{/dashboard}">

                <i class="fa-solid fa-house me-2"></i>
                Dashboard

            </a>

            <!-- PRODUCTOS -->
            <a class="nav-link"
               sec:authorize="hasAnyRole('ADMINISTRADOR','ENCARGADO')"
               th:href="@{/productos/listado}">

                <i class="fa-solid fa-box me-2"></i>
                Productos

            </a>

            <!-- INVENTARIO GENERAL -->
            <a class="nav-link"
               sec:authorize="hasAnyRole('ADMINISTRADOR','ENCARGADO')"
               th:href="@{/inventario}">

                <i class="fa-solid fa-warehouse me-2"></i>
                Inventario General

            </a>

            <!-- CATEGORIAS -->
            <a class="nav-link"
               sec:authorize="hasAnyRole('ADMINISTRADOR','ENCARGADO')"
               th:href="@{/categorias/listado}">

                <i class="fa-solid fa-tags me-2"></i>
                Categorías

            </a>

            <!-- PROVEEDORES -->
            <a class="nav-link"
               sec:authorize="hasAnyRole('ADMINISTRADOR','ENCARGADO')"
               th:href="@{/proveedores/listado}">

                <i class="fa-solid fa-truck me-2"></i>
                Proveedores

            </a>

            <!-- ENTRADAS -->
            <a class="nav-link"
               sec:authorize="hasAnyRole('ADMINISTRADOR','ENCARGADO')"
               th:href="@{/movimientos/entrada}">

                <i class="fa-solid fa-download me-2"></i>
                Entradas

            </a>

            <!-- SALIDAS -->
            <a class="nav-link"
               sec:authorize="hasAnyRole('ADMINISTRADOR','ENCARGADO')"
               th:href="@{/movimientos/salida}">

                <i class="fa-solid fa-upload me-2"></i>
                Salidas

            </a>

            <!-- MOVIMIENTOS -->
            <a class="nav-link"
               sec:authorize="hasAnyRole('ADMINISTRADOR','ENCARGADO')"
               th:href="@{/movimientos/listado}">

                <i class="fa-solid fa-right-left me-2"></i>
                Movimientos

            </a>

            <!-- REPORTES -->
            <a class="nav-link"
               th:href="@{/reportes/bajo-stock}">

                <i class="fa-solid fa-chart-column me-2"></i>
                Reportes

            </a>

            <!-- USUARIOS -->
            <a class="nav-link"
               sec:authorize="hasRole('ADMINISTRADOR')"
               th:href="@{/usuarios/listado}">

                <i class="fa-solid fa-users me-2"></i>
                Usuarios

            </a>

        </nav>

    </div>

</div>

<header class="topbar shadow-sm"
        th:fragment="topbar">

    <div class="d-flex align-items-center">

        <button class="btn btn-link text-dark fs-4 p-0"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#menuLateral"
                aria-controls="menuLateral">

            <i class="fa-solid fa-bars"></i>

        </button>

        <span class="fs-5 fw-bold text-primary ms-3">

            <i class="fa-solid fa-cube"></i>

            Stock<span>Easy</span>

        </span>

    </div>

    <div class="d-flex align-items-center gap-2">

        <span th:text="${session.usuarioSesion != null
                ? session.usuarioSesion.nombre
                : ''}">
        </span>

        <i class="fa-solid fa-circle-user fs-4 text-secondary"></i>

        <form th:action="@{/logout}"
              method="post"
              class="mb-0">

            <button type="submit"
                    class="btn btn-secondary btn-sm">

                <i class="fa-solid fa-right-from-bracket me-1"></i>
                Cerrar sesión

            </button>

        </form>

    </div>

</header>

<footer class="footer bg-primary text-white"
        th:fragment="footer">

    © 2026 StockEasy. Todos los derechos reservados.

</footer>

<div th:fragment="scripts">

    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}">
    </script>

</div>

</body>
</html>
